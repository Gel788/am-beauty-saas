name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ambeauty
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ambeauty"
          --health-interval 3s --health-timeout 5s --health-retries 20
    env:
      MIGRATE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ambeauty
      DATABASE_URL: postgresql://app_user:app_pass@127.0.0.1:5432/ambeauty
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
