services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ambeauty
    ports:
      - "5432:5432"
    volumes:
      - ambeauty_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ambeauty"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  ambeauty_pg:
